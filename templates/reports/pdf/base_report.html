<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: A4; margin: 18mm 14mm; }
        body { font-family: Arial, sans-serif; color: #1f2937; font-size: 11px; }
        h1 { font-size: 22px; margin: 0 0 4px; }
        h2 { font-size: 15px; margin: 18px 0 8px; }
        .muted { color: #6b7280; }
        .summary { width: 100%; border-collapse: collapse; margin: 14px 0; }
        .summary td { border: 1px solid #e5e7eb; padding: 8px; width: 25%; }
        .label { color: #6b7280; font-size: 10px; }
        .value { font-size: 16px; font-weight: bold; margin-top: 3px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { border: 1px solid #d1d5db; padding: 5px; text-align: left; }
        th { background: #f3f4f6; }
        .text-end { text-align: right; }
        .chart { margin: 10px 0 14px; }
        .chart img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
