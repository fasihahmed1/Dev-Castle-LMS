{% extends 'base.html' %}

{% block title %}Student Report - {{ student.full_name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-start mb-4">
    <div>
        <h1 class="h3 mb-1">Student Report</h1>
        <p class="text-muted mb-0">{{ student.full_name }} - Roll #{{ student.roll_number }}</p>
    </div>
    <a href="{% url 'reports:student_pdf' student.pk %}" class="btn btn-primary btn-sm">Download PDF</a>
</div>

{% include 'reports/partials/student_report_body.html' %}
{% endblock %}
