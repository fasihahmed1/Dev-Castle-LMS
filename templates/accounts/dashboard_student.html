{% extends 'base.html' %}

{% block title %}Student Dashboard — Dev Castle LMS{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <h1 class="h3 mb-2">Student Dashboard</h1>
        <p class="text-muted mb-0">
            Welcome, <strong>{{ user.get_full_name|default:user.username }}</strong>.
            You are signed in as <span class="badge text-bg-info text-dark">{{ role_display }}</span>.
        </p>
    </div>
</div>
{% endblock %}
